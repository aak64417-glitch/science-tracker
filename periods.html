<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1526">
<title>سجل متابعة العلوم - الفترات</title>
<style>
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#0b1526;color:#fff}
.loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.card{max-width:520px;background:#13213a;border:1px solid #33456a;border-radius:18px;padding:24px;box-shadow:0 16px 50px #0006}
.card h1{margin:0 0 10px;color:#f2c14e}.card p{margin:0;line-height:1.8;color:#d9dee7}.err{color:#ffd7d7}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="card"><h1>سجل متابعة العلوم</h1><p>جاري فتح السجل وتجهيز الفترة المحددة...</p></div></div>
<script>
(async function(){
  "use strict";
  var ACTIVE_PERIOD_KEY="science_tracker_active_period";
  var PERIOD1_KEY="st_track_v1";
  var PERIOD2_KEY="st_track_v1_period2";
  var period=localStorage.getItem(ACTIVE_PERIOD_KEY);
  if(period!=="2") period="1";

  function clearScoresKeepNames(obj){
    try{
      var grades=obj&&obj.grades?obj.grades:{};
      Object.keys(grades).forEach(function(g){
        Object.keys(grades[g]||{}).forEach(function(sem){
          Object.keys(grades[g][sem]||{}).forEach(function(cls){
            var students=((grades[g][sem][cls]||{}).students||[]);
            students.forEach(function(st){
              if(!st) return;
              if(Array.isArray(st.p)) st.p=st.p.map(function(){return "";});
              if(Array.isArray(st.h)) st.h=st.h.map(function(){return "";});
              if(Array.isArray(st.t)) st.t=st.t.map(function(){return "";});
              if(Array.isArray(st.exams)) st.exams=st.exams.map(function(){return "";});
              if(Object.prototype.hasOwnProperty.call(st,"e1")) st.e1="";
              if(Object.prototype.hasOwnProperty.call(st,"e2")) st.e2="";
            });
          });
        });
      });
      if(obj&&obj.meta) obj.meta.period="الفترة الثانية";
    }catch(e){}
    return obj;
  }

  // عند فتح الفترة الثانية لأول مرة: ننسخ الأسماء والإعدادات فقط من الفترة الأولى،
  // مع إبقاء درجات الفترة الثانية فارغة ومستقلة.
  if(period==="2" && !localStorage.getItem(PERIOD2_KEY)){
    var p1=localStorage.getItem(PERIOD1_KEY);
    if(p1){
      try{
        var cloned=clearScoresKeepNames(JSON.parse(p1));
        localStorage.setItem(PERIOD2_KEY,JSON.stringify(cloned));
      }catch(e){}
    }
  }

  var response=await fetch("./index.html?period-core=v22",{cache:"no-store"});
  if(!response.ok) throw new Error("تعذر تحميل السجل الأساسي");
  var html=await response.text();
  var storageKey=(period==="2")?PERIOD2_KEY:PERIOD1_KEY;
  var cloudKey=(period==="2")?"ALI-TRACKER-2026-P2":"ALI-TRACKER-2026";
  var periodLabel=(period==="2")?"الفترة الثانية":"الفترة الأولى";

  html=html.replace('var STORAGE_KEY = "st_track_v1";','var STORAGE_KEY = "'+storageKey+'";');
  html=html.replace('var CLOUD_KEY = "ALI-TRACKER-2026";','var CLOUD_KEY = "'+cloudKey+'";');

  var gradeMarker='<div class="info-item">الصف:';
  var periodUi='<div class="info-item">الفترة: <select id="periodSelect" aria-label="اختيار فترة إدخال الدرجات"><option value="1">الفترة الأولى</option><option value="2">الفترة الثانية</option></select></div>';
  if(html.indexOf(gradeMarker)!==-1) html=html.replace(gradeMarker,periodUi+gradeMarker);

  var injected='<script>(function(){'+
    'var p="'+period+'";var label="'+periodLabel+'";'+
    'var s=document.getElementById("periodSelect");if(s){s.value=p;s.addEventListener("change",function(){'+
      'try{if(document.activeElement&&document.activeElement!==this){document.activeElement.blur();}}catch(e){}'+
      'localStorage.setItem("'+ACTIVE_PERIOD_KEY+'",this.value);setTimeout(function(){location.reload();},80);'+
    '});}'+
    'var sub=document.querySelector(".sub-row");if(sub&&!document.getElementById("periodDisplayBadge")){var d=document.createElement("span");d.id="periodDisplayBadge";d.className="dot";d.textContent=" • "+label;sub.appendChild(d);}'+
    'document.title=document.title+" - "+label;'+
  '})();<\/script>';
  html=html.replace('</body>',injected+'</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(function(err){
  var box=document.getElementById("loader");
  if(box) box.innerHTML='<div class="card"><h1>تعذر فتح السجل</h1><p class="err">'+String(err&&err.message||err)+'</p><p style="margin-top:12px">يمكن فتح النسخة الأصلية من index.html دون أن تتأثر البيانات.</p></div>';
});
</script>
</body>
</html>
